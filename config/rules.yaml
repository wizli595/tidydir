# tidydir configuration
# Place as tidydir.yaml or .tidydir.yaml in the target directory to override defaults.

# Target folders for each category
folders:
  project: "projects"
  document: "_docs"
  media: "_media"
  font: "_fonts"
  archive: "_archives"

# Additional project markers (beyond built-in ones)
project_markers:
  - file: "docker-compose.yml"
    type: "docker"
  - file: "Makefile"
    type: "make"
  - file: "manage.py"
    type: "django"

# Files/patterns to ignore (never touch)
ignore:
  - "desktop.ini"
  - "*.lnk"
  - "My Music"
  - "My Pictures"
  - "My Videos"

# Custom move rules (pattern -> destination folder)
custom_rules:
  # - pattern: "*.sketch"
  #   dest: "_design"
  # - pattern: "*.fig"
  #   dest: "_design"
